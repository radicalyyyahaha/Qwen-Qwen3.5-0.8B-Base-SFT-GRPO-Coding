# GRPO / RLVR — Phase 4. Starts from the Phase-2 SFT checkpoint and optimizes it
# with a verifiable, test-based reward (generated programs are run against TACO
# unit tests; reward = fraction of tests passed). Tuned for a single A100-40GB.
#
# OOM on A100-40GB? The hidden driver is this model's HUGE vocab (~248k): the
# logits tensor is [seq_len x 248320] — ~1-2 GB per 1024-token sequence — and GRPO
# materializes it for the policy AND reference forwards, x num_generations. Full
# fine-tuning ALSO keeps AdamW optimizer states (~7-10 GB) + a reference-model
# copy, so it OOMs on 40GB even at tiny batch. Fixes, by impact:
#   1. training_type: lora   -> drops the optimizer states AND the ref-model copy.
#   2. shorten max_prompt_length / max_completion_length (logits scale with length).
#   3. beta: 0               -> drops the reference model + its forward (full FT).
#   4. export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True  (fights fragmentation).
#   5. lower num_generations.
# The defaults below are a 40GB-safe LoRA profile.
model: outputs/qwen35_0_8b_code_sft        # the SFT checkpoint (NOT the base model)
train_file: data/grpo/taco_grpo.jsonl
output_dir: outputs/qwen35_0_8b_code_grpo

training_type: lora            # full | lora  (lora is the 40GB-safe default; see OOM notes above)
precision: bf16
attn_implementation: flash_attention_2     # A100 has flash-attn; falls back to sdpa

# Freeze non-text components (full FT only; LoRA already scopes to the decoder).
freeze_vision: true
freeze_mtp: true

# --- GRPO sampling ---
num_generations: 8             # group size G (completions per prompt)
max_prompt_length: 768         # TACO statements are long; left-truncated if over
max_completion_length: 640     # logits are [len x ~248k vocab] -> keep modest on 40GB
temperature: 1.0               # exploration; GRPO needs diverse samples
beta: 0.04                     # KL-to-reference coefficient (0 drops the ref model)

# --- batch / optimizer ---
# per_device_train_batch_size counts *completions* and must be a multiple of
# num_generations. 8 = one prompt's full group per micro-step; grad-accum 4 ->
# 4 prompts per optimizer step. Lower if you OOM.
per_device_train_batch_size: 8
gradient_accumulation_steps: 4
gradient_checkpointing: true
learning_rate: 1.0e-6          # RL fine-tuning uses a much smaller LR than SFT
num_train_epochs: 1
max_steps: 500                 # cap for a demo run (0 = use num_train_epochs)
lr_scheduler_type: constant_with_warmup
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 1.0
optim: adamw_torch_fused
tf32: true

# Generation backend. vLLM is faster but its engine-core init has been flaky for
# this qwen3_5 hybrid; HF generate is the reliable default. Set true to try vLLM.
use_vllm: false

# --- reward / sandbox (src/reward.py + src/sandbox.py) ---
reward_timeout: 6.0            # seconds per test-case execution
reward_mem_mb: 1024            # per-process memory cap (MB)
reward_max_cases: 15           # cap test cases run per problem (speed)
reward_num_workers: 8          # threads scoring one batch in parallel

logging_steps: 1
save_strategy: steps
save_steps: 100
save_total_limit: 2
dataloader_num_workers: 2
report_to: none
seed: 42

# LoRA (only used when training_type: lora)
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
language_model_scope: model.language_model
target_modules: auto
